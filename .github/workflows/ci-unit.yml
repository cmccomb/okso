name: CI - Unit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install shfmt jq bc bats-core pandoc llama.cpp rg

      - name: Check formatting
        run: |
          find src scripts tests -type f \( -name '*.sh' -o -name 'okso' \) -print0 \
            | xargs -0 shfmt -d

      - name: Run Bats suite
        run: bash ./scripts/ci/run-bats.sh

      - name: Check docs
        run: bash ./scripts/ci/check-docs.sh

      - name: Audit comments
        run: bash ./scripts/ci/audit-comments.sh

      - name: Audit consistency
        run: bash ./scripts/ci/audit-consistency.sh
